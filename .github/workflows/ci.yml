name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Import check (no API key required)
        run: |
          cd backend
          python -c "import main; print('Import OK')"
      - name: Health endpoint smoke test
        run: |
          cd backend
          python -c "import main; r = main.health(); assert r['status']=='ok'; print('Health OK')"
      - name: Lint
        run: |
          pip install flake8
          flake8 backend/main.py --max-line-length=120 --extend-ignore=E402,W503 || true
